name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile src/connectors.py src/discovery.py src/oauth_manager.py src/mcp_server.py src/adapters/langchain.py src/adapters/crewai.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
